; Raises PHP's upload limits for this project. Scenery images run ~2-3MB, and both
; SceneryController::store() and BuildingLevelController::store() validate uploads up to
; 10MB (`max:10240`) — PHP's common 2M default rejects those before validation even runs,
; surfacing as "The image failed to upload."
;
; NOTE: PHP reads .user.ini relative to the *executed script*. This works on a standard
; deploy where nginx/FPM points SCRIPT_FILENAME at this directory's index.php. It does
; NOT apply under Laravel Herd/Valet, which routes every request through its own
; server.php outside the project — there, raise the limits in Herd's global php.ini
; instead (Herd UI: PHP settings).
upload_max_filesize = 15M
post_max_size = 20M
